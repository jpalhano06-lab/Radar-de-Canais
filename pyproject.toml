[project]
name = "radar-canais"
version = "0.1.0"
description = "Radar de Canais: acha os canais sem rosto que estão crescendo no YouTube e mede cada vídeo."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "youtube-transcript-api>=1.2.4",
    "yt-dlp>=2026.8.19",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false
